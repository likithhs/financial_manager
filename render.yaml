services:
  - type: web
    name: finora-financial-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && gunicorn --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120 wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: sqlite
      - key: RATELIMIT_DEFAULT
        value: "200 per day; 60 per hour"
    healthCheckPath: /health
